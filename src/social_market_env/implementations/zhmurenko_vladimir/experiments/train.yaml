name: zhmurenko_vladimir_train
mode: train
strict: true
horizon: 50
seeds: [0, 1, 2]
episodes_per_seed: 40
market: {demand_a: 120, demand_b: 1, tau: 5, p_min: 1, p_max: 100, share_model: logit}
agents:
  count: 12
  default: {impl: "social_market_env.baselines.agents:CartelAgent"}
  cost_low: 15
  cost_high: 22
  overrides:
    0:
      impl: "social_market_env.implementations.zhmurenko_vladimir.agent:ZhmurenkoVladimirAgent"
      kwargs:
        model_seed: 0
        settings: {architecture_version: 3, hidden_size: 64, candidate_hidden_size: 32, learning_rate: 0.0003, critic_learning_rate: 0.001, gamma: 0.95, entropy_coefficient: 0.01, value_coefficient: 0.5, reward_scale: 100, balance_scale: 1000, horizon: 50, price_nodes: 9, max_gradient_norm: 1, advantage_clip: 20, price_scale_min: 0.02, price_scale_max: 0.30}
    3: {impl: "social_market_env.baselines.agents:BestResponseAgent"}
    7: {impl: "social_market_env.baselines.agents:RandomAgent", kwargs: {low: 20, high: 60}}
coalitions:
  policy: {impl: "social_market_env.baselines.coalitions:ConnectedComponentsCoalitions", kwargs: {payout: equal}}
  compliance_tolerance: 0.5
arbiter:
  policy: {impl: "social_market_env.baselines.arbiters:ThresholdArbiter", kwargs: {jump_threshold: 4, fine: 50}}
  max_fine: 100
network: {topology: random, mode: evolving, initial_density: 0.3}
scoring: {alpha: 1, beta: 0.1, lambda_fp: 0.5, lambda_fn: 0.5, harm_margin: 0.05}
