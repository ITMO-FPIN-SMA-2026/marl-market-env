# Этап 1 плана коалиции: политика на правилах, агенты всегда соблюдают планы.
name: coalition_stage1
horizon: 64
seeds: [0, 1, 2]
strict: true
market: {demand_a: 120, demand_b: 1, tau: 5, p_min: 1, p_max: 100, share_model: logit}
agents:
  count: 12
  default: {impl: "social_market_env.baselines.agents:CartelAgent"}
  cost_low: 15
  cost_high: 22
coalitions:
  policy:
    impl: "coalition_policy:AdaptiveCoalitionPolicy"
    kwargs: {structure: adaptive, payout: myerson, price_level: moderate}
arbiter:
  policy: {impl: "social_market_env.baselines.arbiters:AlwaysObserve"}
network: {topology: random, mode: evolving, initial_density: 0.3}
