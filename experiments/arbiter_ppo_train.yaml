name: arbiter_ppo_train
horizon: 64
seeds: [0]
episodes_per_seed: 128
mode: train
strict: true
agents:
  count: 4
  default: {impl: 'social_market_env.baselines.agents:CartelAgent'}
coalitions:
  policy: {impl: 'social_market_env.baselines.coalitions:ConnectedComponentsCoalitions'}
network: {topology: complete, mode: static}
arbiter:
  min_fine: 1.0
  max_fine: 100.0
  policy:
    impl: 'ppo_arbiter.online:OnlinePPOArbiter'
    kwargs:
      model_seed: 0
      state_path: 'runs/ppo_arbiter/online.pt'
      warm_start_path: 'runs/ppo_arbiter/both_seed_0_best.pt'
