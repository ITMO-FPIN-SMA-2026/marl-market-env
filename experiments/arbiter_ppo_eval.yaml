name: arbiter_ppo_eval
horizon: 64
seeds: [100, 101, 102]
mode: eval
strict: true
agents:
  count: 4
  default: {impl: 'social_market_env.baselines.agents:CartelAgent'}
coalitions:
  policy: {impl: 'social_market_env.baselines.coalitions:ConnectedComponentsCoalitions'}
network: {topology: complete, mode: static}
arbiter:
  min_fine: 1.0
  max_fine: 100.0
  policy:
    impl: 'ppo_arbiter:PPOArbiter'
    kwargs:
      checkpoint_path: 'runs/ppo_arbiter/both_seed_0_best.pt'
      evaluation: greedy
