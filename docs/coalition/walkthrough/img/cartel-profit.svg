<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" width="620" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Общая прибыль картеля в зависимости от цены</title>
  <rect width="620" height="520" fill="#fcfcfb"/>

  <!-- Сетка -->
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="80" y1="390" x2="536" y2="390"/>
    <line x1="80" y1="320" x2="536" y2="320"/>
    <line x1="80" y1="250" x2="536" y2="250"/>
    <line x1="80" y1="180" x2="536" y2="180"/>
    <line x1="80" y1="110" x2="536" y2="110"/>
  </g>

  <!-- Вспомогательные линии до осей -->
  <g stroke-width="2" stroke-dasharray="5 4">
    <line x1="170.9" y1="387" x2="170.9" y2="460" stroke="#2a78d6"/>
    <line x1="343.2" y1="99.4" x2="343.2" y2="460" stroke="#eb6834"/>
  </g>

  <!-- Кривая прибыли: (p − 18.5)(120 − p) -->
  <polyline fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linejoin="round"
    points="150.3,460 156,439 175,373.6 194,315.1 213,263.7 232,219.2 251,181.8 270,151.3 289,127.9 308,111.4 327,101.9 343.2,99.4 365,104.1 384,115.6 403,134.2 422,159.7 441,192.3 460,231.8 479,278.4 498,331.9 517,392.5 536,460"/>

  <!-- Точки -->
  <circle cx="170.9" cy="387" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="343.2" cy="99.4" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>

  <!-- Оси -->
  <g stroke="#52514e" stroke-width="1.5">
    <line x1="80" y1="460" x2="556" y2="460"/>
    <line x1="80" y1="460" x2="80" y2="50"/>
  </g>
  <g fill="#52514e" font-size="13" text-anchor="end">
    <text x="72" y="464">0</text>
    <text x="72" y="394">500</text>
    <text x="72" y="324">1000</text>
    <text x="72" y="254">1500</text>
    <text x="72" y="184">2000</text>
    <text x="72" y="114">2500</text>
  </g>
  <g fill="#52514e" font-size="13" text-anchor="middle">
    <text x="80" y="480">0</text>
    <text x="156" y="480">20</text>
    <text x="232" y="480">40</text>
    <text x="308" y="480">60</text>
    <text x="384" y="480">80</text>
    <text x="460" y="480">100</text>
    <text x="536" y="480">120</text>
  </g>
  <text x="308" y="508" fill="#0b0b0b" font-size="14" text-anchor="middle">Общая цена картеля, p</text>
  <text x="22" y="255" fill="#0b0b0b" font-size="14" text-anchor="middle" transform="rotate(-90 22 255)">Общая прибыль всех 12, Π</text>

  <!-- Подписи точек -->
  <text x="186" y="418" fill="#0b0b0b" font-size="13" font-weight="600">Конкуренция: p = 23.9</text>
  <text x="186" y="435" fill="#0b0b0b" font-size="13">Π = 522, каждому 43.5</text>
  <text x="343" y="72" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="middle">Картель: p = 69.25</text>
  <text x="343" y="89" fill="#0b0b0b" font-size="13" text-anchor="middle">Π = 2576, каждому 214.6</text>

  <!-- Смысл краёв -->
  <text x="88" y="66" fill="#52514e" font-size="13">← дешевле: мала наценка</text>
  <text x="536" y="148" fill="#52514e" font-size="13" text-anchor="end">дороже: мало</text>
  <text x="536" y="164" fill="#52514e" font-size="13" text-anchor="end">покупателей →</text>
  <text x="96" y="453" fill="#52514e" font-size="12">p = c: прибыль 0</text>
  <text x="530" y="453" fill="#52514e" font-size="12" text-anchor="end">p = 120: никто не купит</text>
</svg>
