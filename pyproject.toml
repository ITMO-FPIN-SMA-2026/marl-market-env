[project]
name = "social-market-env"
version = "2.0.0.dev0"
description = "Environment for the MARL market lab with endogenous coalitions and a social arbiter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "networkx>=3.0"]

[project.optional-dependencies]
viewer = ["streamlit>=1.37", "plotly>=5.22"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
